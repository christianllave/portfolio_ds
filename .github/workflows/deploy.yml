name: Deploy site to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deployment at a time; never cancel one that is mid-flight.
concurrency:
  group: pages
  cancel-in-progress: false

env:
  # Pinned on purpose: builds are reproducible and never break because a new
  # Hugo release changed behaviour. Bump deliberately (roughly quarterly) and
  # run `hugo` locally first.
  HUGO_VERSION: 0.166.0
  TZ: Pacific/Auckland

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Pages
        id: pages
        uses: actions/configure-pages@v6

      - name: Install Hugo (pinned, checksum-verified)
        run: |
          set -euo pipefail
          FILE="hugo_${HUGO_VERSION}_linux-amd64.tar.gz"
          BASE="https://github.com/gohugoio/hugo/releases/download/v${HUGO_VERSION}"
          curl -fsSL -o "$RUNNER_TEMP/$FILE" "$BASE/$FILE"
          curl -fsSL -o "$RUNNER_TEMP/checksums.txt" "$BASE/hugo_${HUGO_VERSION}_checksums.txt"
          (cd "$RUNNER_TEMP" && grep " ${FILE}\$" checksums.txt | sha256sum -c -)
          tar -xzf "$RUNNER_TEMP/$FILE" -C "$RUNNER_TEMP" hugo
          sudo mv "$RUNNER_TEMP/hugo" /usr/local/bin/hugo
          hugo version

      - name: Build
        # base_url comes from the Pages settings, so adding a custom domain
        # later needs no code change. No --minify: Hugo's HTML minifier strips
        # the whitespace between the Skills icons and changes their spacing.
        # (CSS is still minified and fingerprinted by the asset pipeline.)
        run: hugo --gc --baseURL "${{ steps.pages.outputs.base_url }}/"

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: ./public

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
