<header class="site-header">
  <div class="wrap bar">
    <a class="brand" href="{{ site.Home.RelPermalink }}">{{ hugo.Data.profile.name }}</a>
    <nav aria-label="Main">
      <ul>
        {{ range site.Menus.main }}
        <li><a href="{{ .URL }}"{{ if or ($.IsMenuCurrent "main" .) ($.HasMenuCurrent "main" .) }} aria-current="page"{{ end }}>{{ .Name }}</a></li>
        {{ end }}
        <li><a href="{{ site.Home.RelPermalink }}#experience">Experience</a></li>
      </ul>
    </nav>
  </div>
</header>
