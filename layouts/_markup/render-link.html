{{- $dest := .Destination -}}
{{- if and (strings.HasPrefix $dest "/") (not (strings.HasPrefix $dest "//")) }}{{ $dest = strings.TrimPrefix "/" $dest | relURL }}{{ end -}}
<a href="{{ $dest }}"{{ with .Title }} title="{{ . }}"{{ end }}{{ if strings.HasPrefix .Destination "http" }} rel="noopener"{{ end }}>{{ .Text | safeHTML }}</a>
